name: ${COMPOSE_PROJECT_NAME:-campus-graphrag2}

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: prod
    args:
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
  image: campus-graphrag2-api:${APP_VERSION:-dev}
  env_file: .env
  environment:
    ROOT_PATH: /api
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_USER: neo4j
    SQLITE_PATH: /data/app/app.db
    FAISS_DIR: /data/faiss
    DOCUMENT_INDEX_DIR: /data/document_indexes
    EMBEDDING_USAGE_PATH: /data/app/embedding_usage.json
    EMBEDDING_REQUEST_CACHE: /data/embedding_requests
  volumes:
    - app_data:/data/app
    - faiss_indexes:/data/faiss
    - document_indexes:/data/document_indexes
    - embedding_requests:/data/embedding_requests
    - ./data:/app/data

services:
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: prod
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: campus-graphrag2-web:${APP_VERSION:-dev}
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  initialize:
    <<: *backend
    command: ["python", "-m", "scripts.initialize_system"]
    depends_on:
      neo4j:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    depends_on:
      initialize:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: ${API_MEM_LIMIT:-2g}
    restart: unless-stopped

  neo4j:
    image: neo4j:${NEO4J_IMAGE_TAG:-5.26.0-community}
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-512m}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${NEO4J_MEM_LIMIT:-2g}
    restart: unless-stopped

volumes:
  neo4j_data:
  app_data:
  faiss_indexes:
  document_indexes:
  embedding_requests:
