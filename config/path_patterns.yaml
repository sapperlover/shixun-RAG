# 问题类型与目标关系链（V1.2 §4.2）。“任意连通的 2 跳 ≠ 能回答该问题”：
# 候选路径必须逐跳匹配下面的 (type, stored 起点→终点, traverse 方向)，终点类型也必须一致。
# traverse: forward = 沿存储方向走；reverse = 逆存储方向走。
patterns:
  T1:
    name: 2 跳 / 方案规则
    anchor_label: ProgramPlan
    target_label: RuleClause
    required_scope: [major_code, entry_year]
    hops:
      - { type: CONTAINS, stored: [ProgramPlan, CourseCategory], traverse: forward }
      - { type: CITES, stored: [CourseCategory, RuleClause], traverse: forward }

  T2:
    name: 3 跳 / 专业规则
    anchor_label: Professional
    target_label: RuleClause
    required_scope: [major_code, entry_year]
    hops:
      - { type: APPLIES_TO, stored: [ProgramPlan, Professional], traverse: reverse }
      - { type: CONTAINS, stored: [ProgramPlan, CourseCategory], traverse: forward }
      - { type: CITES, stored: [CourseCategory, RuleClause], traverse: forward }

  T3:
    name: 2 跳 / 先修链
    anchor_label: Course
    target_label: Course
    # 待 D1 确认：先修关系是否随培养方案/年级变化。若随年级变化，这里改为 [major_code, entry_year]。
    required_scope: []
    hops:
      - { type: PREREQUISITE_OF, stored: [Course, Course], traverse: forward }
      - { type: PREREQUISITE_OF, stored: [Course, Course], traverse: forward }
