name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env
        run: cp .env.example .env
      - name: Build dev images
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml build api web
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Test (contracts, units, api)
        run: make test
      - name: Build production images
        run: docker compose -f docker-compose.yml build
